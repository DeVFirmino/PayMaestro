<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 768" width="960" role="img" aria-labelledby="payment-flow-title payment-flow-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="payment-flow-title">PayMaestro payment flow</title>
  <desc id="payment-flow-desc">Flowchart of one payment request: a stored idempotency key answers with a replay, 409 or 422; a new key is reserved in the database, screened for fraud, routed through the gateway cascade, and ends Captured, Declined, or in RequiresReconciliation until a reconcile call settles it.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- ARROWS (drawn before boxes) -->
  <!-- start -> key diamond -->
  <line x1="320" y1="88" x2="320" y2="128" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- key diamond -> stored answer (YES) -->
  <line x1="428" y1="180" x2="596" y2="180" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="496" y="160" width="32" height="12" rx="2" fill="#f5f5f5"/>
  <text x="512" y="168" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
  <!-- key diamond -> reserve (NO) -->
  <line x1="320" y1="228" x2="320" y2="260" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="332" y="236" width="24" height="12" rx="2" fill="#f5f5f5"/>
  <text x="344" y="244" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
  <!-- reserve -> fraud diamond -->
  <line x1="320" y1="336" x2="320" y2="372" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- fraud diamond -> FraudRejected (YES) -->
  <line x1="428" y1="424" x2="596" y2="424" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="496" y="404" width="32" height="12" rx="2" fill="#f5f5f5"/>
  <text x="512" y="412" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
  <!-- fraud diamond -> cascade (NO) -->
  <line x1="320" y1="472" x2="320" y2="508" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="332" y="480" width="24" height="12" rx="2" fill="#f5f5f5"/>
  <text x="344" y="488" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
  <!-- cascade -> final (ANSWERED) -->
  <line x1="320" y1="592" x2="320" y2="668" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="244" y="620" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="276" y="628" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANSWERED</text>
  <!-- cascade -> reconciliation (NO ANSWER) -->
  <line x1="464" y1="552" x2="596" y2="552" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="496" y="532" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="528" y="540" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO ANSWER</text>
  <!-- reconciliation -> final (dashed, later API call) -->
  <path d="M 720 588 L 720 692 Q 720 700 712 700 L 444 700" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
  <rect x="536" y="680" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="580" y="688" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECONCILE</text>

  <!-- NODES -->
  <!-- start: payment request -->
  <rect x="200" y="32" width="240" height="56" rx="28" fill="#f5f5f5"/>
  <rect x="200" y="32" width="240" height="56" rx="28" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="320" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Payment request</text>
  <text x="320" y="72" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /api/payments + Idempotency-Key</text>

  <!-- decision: key already stored? -->
  <polygon points="320,132 428,180 320,228 212,180" fill="#f5f5f5"/>
  <polygon points="320,132 428,180 320,228 212,180" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="320" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Key already stored?</text>

  <!-- terminal: stored answer -->
  <rect x="600" y="148" width="280" height="64" rx="32" fill="#f5f5f5"/>
  <rect x="600" y="148" width="280" height="64" rx="32" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="740" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stored answer</text>
  <text x="740" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">200 replay · 409 in flight · 422 changed</text>

  <!-- focal: reserve the key -->
  <rect x="192" y="264" width="256" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="192" y="264" width="256" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="320" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reserve the key</text>
  <text x="320" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">payment row committed as Processing</text>
  <text x="320" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no gateway contacted yet</text>

  <!-- decision: fraud rule hit? -->
  <polygon points="320,376 428,424 320,472 212,424" fill="#f5f5f5"/>
  <polygon points="320,376 428,424 320,472 212,424" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="320" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fraud rule hit?</text>

  <!-- terminal: FraudRejected -->
  <rect x="600" y="396" width="240" height="56" rx="28" fill="#f5f5f5"/>
  <rect x="600" y="396" width="240" height="56" rx="28" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="720" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FraudRejected</text>
  <text x="720" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">0 gateway calls</text>

  <!-- step: route and cascade -->
  <rect x="176" y="512" width="288" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="176" y="512" width="288" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="320" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Route and cascade</text>
  <text x="320" y="552" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">currency · cap · priority from config</text>
  <text x="320" y="568" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">every attempt saved</text>

  <!-- state: RequiresReconciliation -->
  <rect x="600" y="516" width="240" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="600" y="516" width="240" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="720" y="548" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RequiresReconciliation</text>
  <text x="720" y="564" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cascade stops</text>

  <!-- terminal: captured or declined -->
  <rect x="200" y="672" width="240" height="56" rx="28" fill="#f5f5f5"/>
  <rect x="200" y="672" width="240" height="56" rx="28" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="320" y="696" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Captured or Declined</text>
  <text x="320" y="712" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">final status</text>
</svg>
